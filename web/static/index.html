    <span class="brand-divider"></span>
    <span class="brand-name">MEDIA INGEST</span>
  </div>
  <div class="project" id="project-name">&nbsp;</div>
  <div class="health">
    <span class="dot" id="health-dot"></span>
    <span id="health-label">NAS: &ndash;</span>
  </div>
  <div class="health">
    <span class="dot" id="storage-dot"></span>
    <span id="storage-label">Almacenamiento: &ndash;</span>
  </div>
</header>

<main>
  <section id="active-area" class="active-area">
    <div class="idle-state" id="idle-state">
      <div class="idle-icon-ring">
        <svg class="idle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <path d="M3 9.5h18"/>
          <circle cx="8" cy="14.5" r="1.3" fill="currentColor" stroke="none"/>
          <circle cx="13" cy="14.5" r="1.3" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <p class="idle-message">Esperando tarjeta<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
      <p class="idle-hint">Inserta una SD o CFexpress en el lector para empezar</p>
      <p class="idle-stats" id="idle-stats"></p>
    </div>
  </section>

  <section class="history">
    <h2>Historial</h2>
    <div class="history-table-wrap">
      <table id="history-table">
        <thead>
          <tr>
            <th>Cámara</th>
            <th>Tarjeta</th>
            <th>Estado</th>
            <th>Verificación</th>
            <th>Archivos</th>
            <th>Tamaño</th>
            <th>Detectada</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
  </section>
</main>

<template id="card-template">
  <article class="card">
    <div class="card-header">
      <span class="card-title"></span>
      <span class="status-pill"><span class="pill-icon"></span><span class="status-pill-text"></span></span>
    </div>
    <div class="no-eject-banner">NO RETIRAR TARJETA</div>
    <div class="camera-picker">
      <p>Selecciona cámara</p>
      <div class="camera-buttons"></div>
    </div>
    <div class="progress-block">
      <div class="progress-headline">
        <span class="progress-percent">0%</span>
        <span class="progress-speed"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
      <div class="progress-stats">
        <span class="progress-bytes"></span>
        <span class="progress-files"></span>
      </div>
    </div>
    <div class="error-block"></div>
    <div class="cancelled-block"></div>
    <div class="action-row actions-eject">
      <button class="btn btn-eject">EXPULSAR</button>
    </div>
    <div class="action-row actions-cancel">
      <button class="btn btn-cancel">CANCELAR COPIA</button>
    </div>
    <div class="action-row actions-retry">
      <button class="btn btn-retry">REINTENTAR</button>
    </div>
  </article>
</template>

<script src="/app.js"></script>
</body>
</html>
